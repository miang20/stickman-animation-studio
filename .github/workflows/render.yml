name: Render Stickman Episode

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Episode length in minutes"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "5"
          - "8"
        default: "5"
      resolution:
        description: "720p is the safer free-runner default; 1080p is heavier"
        required: true
        type: choice
        options:
          - "720p"
          - "1080p"
        default: "720p"
      voice:
        description: "Narration voice on/off"
        required: true
        type: choice
        options:
          - "on"
          - "off"
        default: "on"
      voice_name:
        description: "Kokoro English voice (af_heart is the default)"
        required: true
        type: choice
        options:
          - "af_heart"
          - "af_bella"
          - "af_nova"
          - "af_alloy"
          - "am_adam"
          - "am_michael"
        default: "af_heart"
      character_color:
        description: "Main colour for every recurring character"
        required: true
        type: choice
        options:
          - "blue"
          - "cyan"
          - "red"
          - "green"
          - "purple"
          - "orange"
          - "yellow"
          - "pink"
          - "white"
          - "black"
        default: "blue"

permissions:
  contents: read

concurrency:
  group: stickman-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch for Kokoro
        run: python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Verify Kokoro voice engine
        run: python -c "import torch, transformers, kokoro, soundfile; print('torch=' + torch.__version__); print('transformers=' + transformers.__version__); print('Kokoro voice engine ready')"

      - name: Validate episode script
        run: python -c "import json; from engine.render import validate; validate(json.load(open('scripts/episode.json', encoding='utf-8'))); print('Episode JSON and character IDs are valid')"

      - name: Render MP4
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          RESOLUTION: ${{ inputs.resolution }}
          VOICE: ${{ inputs.voice }}
          VOICE_NAME: ${{ inputs.voice_name }}
          CHARACTER_COLOR: ${{ inputs.character_color }}
        run: python engine/render.py

      - name: Verify MP4 output
        run: |
          test -s output/stickman-episode.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of default=noprint_wrappers=1 output/stickman-episode.mp4

      - name: Upload MP4 and captions package
        uses: actions/upload-artifact@v4
        with:
          name: stickman-episode-package
          path: output/*
          if-no-files-found: error
          retention-days: 7
